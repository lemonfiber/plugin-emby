# Ask the catalogue to move this plugin's pin in the default bundle once the train's
# `release/adapter-pin` merges, through spec's reusable `first-party-bundle` (OPS-R86).
name: bundle
on:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  bundle:
    permissions:
      contents: read
      pull-requests: read
    uses: lemonfiber/spec/.github/workflows/first-party-bundle.yml@64d1219a43dff7c1ad59079c6088dc95580e77bf # v1.0.162
    with:
      pin: adapter
    secrets:
      RELEASE_APP_KEY: ${{ secrets.RELEASE_APP_KEY }}
